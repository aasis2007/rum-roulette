<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rum Roulette – Junge Kaji</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #150000;
    color: #F2D9C0;
    font-family: sans-serif;
  }

  /* ── Two-column grid — desktop ───────────────────────── */
  #layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 100vh;
  }

  /* ── Left panel ──────────────────────────────────────── */
  #left-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    padding: 48px 36px;
    border-right: 1px solid #2a0505;
  }

  #left-panel img {
    max-height: 64px;
    max-width: 100%;
    object-fit: contain;
    align-self: flex-start;
  }

  .brand h1 {
    font-size: 2.2rem;
    color: #BF2020;
    letter-spacing: 3px;
    line-height: 1.1;
  }
  .brand .tagline {
    color: #C49A6C;
    letter-spacing: 5px;
    font-size: 0.75rem;
    margin-top: 6px;
  }

  #result {
    background: #1e0202;
    border: 1px solid #3a0808;
    border-radius: 8px;
    padding: 18px 22px;
  }
  #result .label { color: #C49A6C; font-size: 0.68rem; letter-spacing: 3px; margin-bottom: 5px; }
  #result .name  { color: #F2D9C0; font-size: 1.4rem; font-weight: bold; }
  #result .desc  { color: #9A7A5A; font-size: 0.85rem; margin-top: 5px; }

  #spin-btn {
    background: #BF2020;
    color: #F9EDE0;
    border: none;
    padding: 16px 0;
    font-size: 1.05rem;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 4px;
    width: 100%;
    transition: background 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #spin-btn:hover    { background: #9a1a1a; }
  #spin-btn:active   { background: #6a0f0f; }
  #spin-btn:disabled { background: #3a0808; cursor: not-allowed; }

  /* ── Right panel ─────────────────────────────────────── */
  #right-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  canvas { display: block; touch-action: manipulation; }

  /* ── Modal ───────────────────────────────────────────── */
  #modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.80);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: #1e0303;
    border: 1px solid #8B1A1A;
    border-radius: 10px;
    padding: 28px 24px;
    max-width: 440px;
    width: 100%;
    position: relative;
    max-height: 88vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #modal h2          { color: #BF2020; margin-bottom: 6px; font-size: 1.3rem; }
  #modal .modal-type { color: #C49A6C; font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 12px; }
  #modal p  { color: #F2D9C0; line-height: 1.7; font-size: 0.93rem; }
  #modal ul { color: #F9EDE0; padding-left: 18px; margin: 8px 0; line-height: 1.8; font-size: 0.88rem; }
  #modal ol { color: #F9EDE0; padding-left: 18px; margin: 8px 0; line-height: 1.8; font-size: 0.88rem; }
  #modal-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none; color: #9A7A5A;
    font-size: 1.4rem; cursor: pointer; padding: 4px 8px;
    -webkit-tap-highlight-color: transparent;
  }
  #modal-close:hover { color: #F2D9C0; }

  /* ── Tablet ──────────────────────────────────────────── */
  @media (max-width: 860px) {
    #layout { grid-template-columns: 300px 1fr; }
    #left-panel { padding: 36px 24px; gap: 20px; }
    .brand h1 { font-size: 1.8rem; }
  }

  /* ── Mobile: stack ───────────────────────────────────── */
  @media (max-width: 600px) {
    #layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
    }
    #left-panel {
      border-right: none;
      border-bottom: 1px solid #2a0505;
      padding: 24px 20px;
      gap: 16px;
    }
    #left-panel img { max-height: 48px; }
    .brand h1  { font-size: 1.6rem; letter-spacing: 2px; }
    .brand .tagline { font-size: 0.7rem; letter-spacing: 4px; }
    #result { padding: 14px 16px; }
    #result .name { font-size: 1.2rem; }
    #spin-btn { padding: 14px 0; font-size: 1rem; }
    #right-panel { padding: 20px 16px; }
  }
</style>
</head>
<body>

<div id="layout">

  <!-- LEFT -->
  <div id="left-panel">
    <img src="./Asset 18@4x.png" alt="Junge Kaji" onerror="this.style.display='none'">
    <div class="brand">
      <h1>RUM ROULETTE</h1>
      <p class="tagline">SPIN · SIP · SURRENDER</p>
    </div>
    <div id="result">
      <div class="label">RESULT</div>
      <div class="name" id="result-name">—</div>
      <div class="desc" id="result-desc"></div>
    </div>
    <button id="spin-btn">SPIN</button>
  </div>

  <!-- RIGHT -->
  <div id="right-panel">
    <canvas id="wheel"></canvas>
  </div>

</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <div class="modal-type" id="modal-type"></div>
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const SEGMENTS = [
  {
    name: "The Classic",     type: "COCKTAIL",
    desc: "Highland Rum & Soda",
    ingredients: ["60ml Highland Rum","15ml lime juice","10ml simple syrup","Soda water","Lime to garnish"],
    method: ["Fill glass with ice.","Pour rum and lime juice.","Add simple syrup.","Top with soda water.","Garnish with lime."]
  },
  {
    name: "Merch Drop",      type: "GIFT",
    desc: "Branded tumbler or bandana",
    info: "Show this result to your bartender to claim your Junge Kaji merch. One per customer."
  },
  {
    name: "The Daredevil",   type: "COCKTAIL",
    desc: "Spiced Chili-Mango Rum Fizz",
    ingredients: ["60ml Highland Spiced Rum","45ml mango purée","15ml chili syrup","20ml lime juice","Ginger beer","Chili & lime to garnish"],
    method: ["Muddle chili in shaker.","Add rum, mango, syrup, lime with ice.","Shake hard for 15 seconds.","Strain over fresh ice.","Top with ginger beer, garnish."]
  },
  {
    name: "Double Down",     type: "OFFER",
    desc: "Buy 1 Get 1 Free",
    info: "Valid on any Junge Kaji cocktail. Show this screen to your bartender. One use per visit."
  },
  {
    name: "The Fresh Start", type: "COCKTAIL",
    desc: "Highland Mojito",
    ingredients: ["50ml Highland Rum","25ml lime juice","15ml sugar syrup","12–15 fresh mint leaves","Soda water","Mint & lime to garnish"],
    method: ["Clap mint leaves to release aroma.","Muddle lightly with lime juice and syrup.","Fill glass with crushed ice.","Pour in rum.","Top with soda, stir from bottom, garnish."]
  },
  {
    name: "Spin Again",      type: "WILDCARD",
    desc: "The wheel has more to say…",
    info: "Fate isn't done with you. Spinning again in 2 seconds…"
  },
  {
    name: "The Sunset",      type: "COCKTAIL",
    desc: "Passionfruit & Ginger Punch",
    ingredients: ["50ml Highland Dark Rum","60ml passionfruit juice","20ml ginger syrup","15ml lime juice","Passionfruit to garnish"],
    method: ["Optional: rim glass with chili salt.","Shake all ingredients with ice for 12 seconds.","Strain over large ice cube.","Garnish with halved passionfruit."]
  },
  {
    name: "House Special",   type: "VIP",
    desc: "Bartender's secret cocktail",
    info: "The recipe changes nightly. Trust the wheel. Ask your bartender — they know what to do.",
    jackpot: true
  }
];

const canvas     = document.getElementById('wheel');
const ctx        = canvas.getContext('2d');
const rightPanel = document.getElementById('right-panel');
const N          = SEGMENTS.length;
const TAU        = 2 * Math.PI;
const slice      = TAU / N;

let cx, cy, R;
let currentAngle = 0;
let spinning     = false;

// ── Responsive canvas sizing ───────────────────────────────────
function resizeCanvas() {
  const pw = rightPanel.clientWidth  - 64; // account for padding
  const ph = rightPanel.clientHeight - 64;
  const size = Math.max(220, Math.min(560, Math.min(pw, ph)));
  canvas.width  = size;
  canvas.height = size;
  cx = size / 2;
  cy = size / 2;
  // Leave room for outer ring (14) + pointer tip (28)
  R  = Math.floor(size / 2 - 42);
  drawWheel(currentAngle);
}

new ResizeObserver(resizeCanvas).observe(rightPanel);
resizeCanvas();

// ── Draw ───────────────────────────────────────────────────────
function drawWheel(angle) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const labelSize = Math.max(9, Math.floor(R * 0.054));
  const capR      = Math.max(14, Math.floor(R * 0.115));

  // Drop shadow
  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur    = Math.floor(R * 0.16);
  ctx.shadowOffsetX = Math.floor(R * 0.025);
  ctx.shadowOffsetY = Math.floor(R * 0.05);
  ctx.beginPath();
  ctx.arc(cx, cy, R + 14, 0, TAU);
  ctx.fillStyle = '#150000';
  ctx.fill();
  ctx.restore();

  // Base ring
  ctx.beginPath();
  ctx.arc(cx, cy, R + 14, 0, TAU);
  ctx.fillStyle = '#1a0000';
  ctx.fill();

  // Alternating segments
  const segFills = ['#F9EDE0', '#BF2020'];
  const segText  = ['#7a1010', '#F9EDE0'];
  for (let i = 0; i < N; i++) {
    const start = angle + i * slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, start, start + slice);
    ctx.closePath();
    ctx.fillStyle = segFills[i % 2];
    ctx.fill();
  }

  // Dome lighting
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.clip();
  const dome = ctx.createRadialGradient(
    cx - R * 0.28, cy - R * 0.28, R * 0.04,
    cx, cy, R
  );
  dome.addColorStop(0,    'rgba(255,245,230,0.40)');
  dome.addColorStop(0.42, 'rgba(255,220,185,0.07)');
  dome.addColorStop(0.72, 'rgba(0,0,0,0.08)');
  dome.addColorStop(1,    'rgba(0,0,0,0.42)');
  ctx.fillStyle = dome;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();

  // Bevelled dividers
  for (let i = 0; i < N; i++) {
    const la = angle + i * slice;
    const ex = cx + Math.cos(la) * R;
    const ey = cy + Math.sin(la) * R;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.strokeStyle = 'rgba(255,230,200,0.18)'; ctx.lineWidth = 1; ctx.stroke();
  }

  // Labels
  for (let i = 0; i < N; i++) {
    const start = angle + i * slice;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = segText[i % 2];
    ctx.font = `bold ${labelSize}px sans-serif`;
    const words = SEGMENTS[i].name.split(' ');
    if (words.length > 2) {
      ctx.fillText(words.slice(0, 2).join(' '), R - Math.floor(R * 0.065), -Math.floor(labelSize * 0.6));
      ctx.fillText(words.slice(2).join(' '),    R - Math.floor(R * 0.065),  Math.floor(labelSize * 0.8));
    } else {
      ctx.fillText(SEGMENTS[i].name, R - Math.floor(R * 0.065), Math.floor(labelSize * 0.38));
    }
    ctx.restore();
  }

  // Inner edge highlight
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = 'rgba(255,215,160,0.5)'; ctx.lineWidth = 2; ctx.stroke();

  // Dark band
  ctx.beginPath(); ctx.arc(cx, cy, R + 8, 0, TAU);
  ctx.strokeStyle = '#120000'; ctx.lineWidth = 16; ctx.stroke();

  // Copper rim
  const rimG = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  rimG.addColorStop(0,    '#eac880');
  rimG.addColorStop(0.35, '#C49A6C');
  rimG.addColorStop(0.65, '#96703a');
  rimG.addColorStop(1,    '#5a3a10');
  ctx.beginPath(); ctx.arc(cx, cy, R + 9, 0, TAU);
  ctx.strokeStyle = rimG; ctx.lineWidth = 4; ctx.stroke();

  // Centre cap
  const capG = ctx.createRadialGradient(cx - capR*0.3, cy - capR*0.3, 1, cx, cy, capR);
  capG.addColorStop(0,   '#f5d898');
  capG.addColorStop(0.4, '#C49A6C');
  capG.addColorStop(0.8, '#7a4820');
  capG.addColorStop(1,   '#2e1000');
  ctx.beginPath(); ctx.arc(cx, cy, capR, 0, TAU);
  ctx.fillStyle = capG; ctx.fill();
  ctx.strokeStyle = 'rgba(240,200,130,0.65)'; ctx.lineWidth = 1.5; ctx.stroke();

  const specG = ctx.createRadialGradient(cx - capR*0.35, cy - capR*0.35, 1, cx - capR*0.2, cy - capR*0.2, capR*0.65);
  specG.addColorStop(0, 'rgba(255,255,255,0.68)');
  specG.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx, cy, capR, 0, TAU);
  ctx.fillStyle = specG; ctx.fill();

  // ── Fixed needle — base on centre cap, tip at rim ────────────
  // Drawn after cap so it sits on top; angle is always 0 (3 o'clock)
  const needleW    = Math.max(4, Math.floor(R * 0.032)); // half-width at base
  const shaftEnd   = cx + R * 0.78;                      // where shaft meets head
  const tipX       = cx + R - 4;                         // tip just inside rim

  // Shaft
  const shaftG = ctx.createLinearGradient(cx + capR, cy, tipX, cy);
  shaftG.addColorStop(0,   '#c8a060');
  shaftG.addColorStop(0.5, '#F9EDE0');
  shaftG.addColorStop(1,   '#BF2020');
  ctx.beginPath();
  ctx.moveTo(cx + capR, cy - needleW * 0.55);
  ctx.lineTo(shaftEnd,  cy - needleW * 0.55);
  ctx.lineTo(shaftEnd,  cy + needleW * 0.55);
  ctx.lineTo(cx + capR, cy + needleW * 0.55);
  ctx.closePath();
  ctx.fillStyle = shaftG; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.75; ctx.stroke();

  // Arrowhead
  const headG = ctx.createLinearGradient(shaftEnd, cy - needleW, tipX, cy);
  headG.addColorStop(0, '#F9EDE0');
  headG.addColorStop(1, '#BF2020');
  ctx.beginPath();
  ctx.moveTo(tipX,     cy);
  ctx.lineTo(shaftEnd, cy - needleW);
  ctx.lineTo(shaftEnd, cy + needleW);
  ctx.closePath();
  ctx.fillStyle = headG; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.75; ctx.stroke();
}

// ── Spin ───────────────────────────────────────────────────────
const btn = document.getElementById('spin-btn');

function getWinner(finalAngle) {
  const a = ((-finalAngle) % TAU + TAU) % TAU;
  return Math.floor(a / slice) % N;
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}
function playTick() {
  const ac = getAudio(), o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.frequency.value = 800;
  g.gain.setValueAtTime(0.15, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
  o.start(); o.stop(ac.currentTime + 0.05);
}
function playFanfare(jackpot) {
  const ac = getAudio();
  (jackpot ? [523,659,784,1047,1319] : [523,659,784,1047]).forEach((freq, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = freq;
    const t = ac.currentTime + i * 0.12;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.start(t); o.stop(t + 0.4);
  });
}

function spin() {
  if (spinning) return;
  spinning = true; btn.disabled = true;
  if (!audioCtx) audioCtx = new AudioCtx();

  const totalAngle = (5 + Math.floor(Math.random() * 5)) * TAU + Math.random() * TAU;
  const duration   = 4000;
  const t0         = performance.now();
  const a0         = currentAngle;
  let lastSeg      = -1;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  (function frame(now) {
    const t = Math.min((now - t0) / duration, 1);
    currentAngle = a0 + totalAngle * easeOut(t);
    drawWheel(currentAngle);
    const seg = Math.floor(((- currentAngle) % TAU + TAU) % TAU / slice) % N;
    if (seg !== lastSeg) { playTick(); lastSeg = seg; }
    if (t < 1) { requestAnimationFrame(frame); return; }
    spinning = false; btn.disabled = false;
    showResult(getWinner(currentAngle));
  })(t0);
}

function showResult(idx) {
  const seg = SEGMENTS[idx];
  document.getElementById('result-name').textContent = seg.name;
  document.getElementById('result-desc').textContent = seg.desc;
  playFanfare(seg.jackpot);

  document.getElementById('modal-type').textContent  = seg.type;
  document.getElementById('modal-title').textContent = seg.name;
  let body = '';
  if (seg.ingredients) {
    body += '<p style="color:#C49A6C;font-size:0.72rem;letter-spacing:2px;margin-bottom:4px;">INGREDIENTS</p>';
    body += '<ul>' + seg.ingredients.map(i => `<li>${i}</li>`).join('') + '</ul>';
    body += '<p style="color:#C49A6C;font-size:0.72rem;letter-spacing:2px;margin:12px 0 4px;">METHOD</p>';
    body += '<ol>' + seg.method.map(s => `<li>${s}</li>`).join('') + '</ol>';
  } else {
    body += `<p>${seg.info}</p>`;
  }
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');

  if (seg.name === 'Spin Again') {
    setTimeout(() => {
      document.getElementById('modal-overlay').classList.remove('open');
      spin();
    }, 2000);
  }
}

btn.addEventListener('click', spin);
document.getElementById('modal-close').addEventListener('click', () =>
  document.getElementById('modal-overlay').classList.remove('open'));
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) document.getElementById('modal-overlay').classList.remove('open');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
});
</script>
</body>
</html>
